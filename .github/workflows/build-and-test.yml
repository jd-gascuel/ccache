# 2025-03-05 - Imported from Action template & old .travis.yml  file
name: Build & test ccache

#---- Trigers ----------------------------------------------------------------
on:
  push:
    branches: [ "windows", "master" ]
  pull_request:
    branches: [ "windows", "master" ]

#---- What to do ? -----------------------------------------------------------
jobs:
  example_matrix:
    #---- Defines variants of the compilation environments -------------------
    strategy:
      fail-fast: true
      matrix:
        # See existing oe from: https://github.com/actions/runner-images
        os: [ubuntu-20.04, ubuntu-latest]
        experimental: [false]
        include:
        - os: windows-2022
          experimental: true
          onWindows: true
          make: nmake

    #---- Run on the variants ------------------------------------------------
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
    - uses: actions/checkout@v4

    - name: Linux autogen and configure
      if:   ${{ ! matrix.onWindows }}
      run:  |
        bash autogen.sh
        bash configure $HOST

    - name: Windows configure ... not yet there !
      if:   ${{ matrix.onWindows }}
      shell: cmd
      run:  |
        set
        dir %CONDA%
        dir %VCPKG_INSTALLATION_ROOT%
        echo nmake > make.bat

    - name: make
      run:  make 

    - name: test
      run:  make ${TEST:-test}
